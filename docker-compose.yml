services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_ai}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whatsapp_ai_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-whatsapp_ai}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-whatsapp_ai}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-with-a-long-random-secret}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8091,http://127.0.0.1:8091}
      BOT_WORKER_BASE_URL: http://bot-worker:4001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8091/#/login}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      ENABLE_BOT_SQL_CONSOLE: ${ENABLE_BOT_SQL_CONSOLE:-false}
      ALLOW_CLIENT_BOT_START: ${ALLOW_CLIENT_BOT_START:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      bot-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - whatsapp_ai_internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot-worker:
    build:
      context: .
      dockerfile: apps/bot-worker/Dockerfile
    environment:
      NODE_ENV: production
      BOT_WORKER_PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-whatsapp_ai}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-whatsapp_ai}?schema=public
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
      BOT_PROVIDER: ${BOT_PROVIDER:-mock}
      BOT_SESSION_DIR: /var/lib/whatsapp-sessions
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - bot_sessions:/var/lib/whatsapp-sessions
    networks:
      - whatsapp_ai_internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8091:8091"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - whatsapp_ai_internal
    restart: unless-stopped

networks:
  whatsapp_ai_internal:
    driver: bridge

volumes:
  postgres_data:
  bot_sessions:
  caddy_data:
  caddy_config:
