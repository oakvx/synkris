<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 348" width="1280" height="348" role="img" aria-labelledby="t d">
<title id="t">Tre motivi per scegliere synk</title><desc id="d">Tre card viola e fucsia: meno interruzioni, agenda più chiara, più tempo per le persone.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190E31"/><stop offset="1" stop-color="#2B1440"/></linearGradient><linearGradient id="a" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#8759FA"/><stop offset="1" stop-color="#FF43C6"/></linearGradient></defs>
<rect width="1280" height="348" rx="25" fill="url(#b)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="45" y="55" font-size="28" fill="#FFF" font-weight="780">Tecnologia al servizio di chi lavora.</text>
<text x="45" y="86" font-size="15" fill="#CDB8E2">Migliora il flusso di lavoro senza rinunciare al controllo delle decisioni.</text>
<g transform="translate(40 114)"><rect width="382" height="204" rx="19" fill="#2D1A44" stroke="#724497"/><circle cx="44" cy="46" r="24" fill="#5D2784"/><path d="M34 41h19M34 48h14M34 55h10" stroke="#F9C4F4" stroke-width="3" stroke-linecap="round"/><text x="83" y="42" font-size="20" fill="#FFF" font-weight="750">Meno interruzioni</text><text x="83" y="66" font-size="14" fill="#D5BDE8">Richieste e conversazioni organizzate</text><path d="M27 99h326" stroke="#744D89"/><text x="27" y="128" font-size="16" fill="#EADDF6">Meno passaggi ripetitivi.</text><text x="27" y="155" font-size="16" fill="#EADDF6">Più continuità nel lavoro.</text><rect x="27" y="174" width="96" height="4" rx="2" fill="url(#a)"/></g>
<g transform="translate(450 114)"><rect width="382" height="204" rx="19" fill="#2D1A44" stroke="#724497"/><circle cx="44" cy="46" r="24" fill="#5D2784"/><rect x="32" y="35" width="25" height="24" rx="5" fill="none" stroke="#F9C4F4" stroke-width="2.5"/><path d="M33 43h24M39 31v8M50 31v8" stroke="#F9C4F4" stroke-width="2.5"/><text x="83" y="42" font-size="20" fill="#FFF" font-weight="750">Agenda più chiara</text><text x="83" y="66" font-size="14" fill="#D5BDE8">Servizi, tempi e operatrici coordinati</text><path d="M27 99h326" stroke="#744D89"/><text x="27" y="128" font-size="16" fill="#EADDF6">Disponibilità da verificare.</text><text x="27" y="155" font-size="16" fill="#EADDF6">Stati sempre espliciti.</text><rect x="27" y="174" width="96" height="4" rx="2" fill="url(#a)"/></g>
<g transform="translate(860 114)"><rect width="382" height="204" rx="19" fill="#2D1A44" stroke="#724497"/><circle cx="44" cy="46" r="24" fill="#5D2784"/><path d="M44 58C26 47 29 35 37 34c4 0 7 3 7 5 0-2 4-5 8-5 9 2 9 13-8 24Z" fill="none" stroke="#F9C4F4" stroke-width="2.4"/><text x="83" y="42" font-size="20" fill="#FFF" font-weight="750">Più tempo umano</text><text x="83" y="66" font-size="14" fill="#D5BDE8">Il team può riprendere ogni conversazione</text><path d="M27 99h326" stroke="#744D89"/><text x="27" y="128" font-size="16" fill="#EADDF6">Automazione quando serve.</text><text x="27" y="155" font-size="16" fill="#EADDF6">Una persona quando conta.</text><rect x="27" y="174" width="96" height="4" rx="2" fill="url(#a)"/></g>
</g></svg>