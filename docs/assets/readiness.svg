<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="328" viewBox="0 0 1280 328" role="img" aria-labelledby="title desc">
<title id="title">Stato reale della release al 2026-11-08</title><desc id="desc">CI della base bdee2e5: 6 job verdi e 92 test Node. Il modello scelto è proprietario/source-available: uso privato non commerciale gratuito, altri usi su accordo commerciale. Non è open source. OpenWA rimosso; nuovo provider whatsapp-web.js Apache-2.0. Test locali della migrazione: 139. Audit: 19 rilievi, 11 elevati, zero critici. La CI storica non sostituisce quella della nuova PR. Restano i collaudi reali. Questi numeri sono uno snapshot, non un controllo live.</desc>
