 <text x="64" y="299" fill="#FFF" font-size="55" font-weight="800" letter-spacing="-2">Più <tspan fill="#F472D0">relazione.</tspan></text>
 <text x="64" y="354" fill="#DACCEA" font-size="21">L'assistente operativo per i saloni:</text>
 <text x="64" y="385" fill="#DACCEA" font-size="21">appuntamenti, messaggi e agenda</text>
 <text x="64" y="416" fill="#DACCEA" font-size="21">in un flusso più semplice.</text>
