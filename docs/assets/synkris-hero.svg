<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 550" width="1280" height="550" role="img" aria-labelledby="title desc">
<title id="title">SYNKRIS — tecnologia che lascia spazio alle persone</title>
<desc id="desc">Banner vettoriale viola e fucsia con il prodotto synk e un'illustrazione concettuale della dashboard e di una chat. Non è uno screenshot reale.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120923"/><stop offset=".55" stop-color="#211044"/><stop offset="1" stop-color="#090613"/></linearGradient>
