<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="334" viewBox="0 0 1280 334" role="img" aria-labelledby="title desc">
<title id="title">Il flusso di una prenotazione</title><desc id="desc">Scelta dei servizi, verifiche fail-closed, transazione locale con outbox e sincronizzazione asincrona. Un salvataggio in coda non è ancora un successo su Google.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#749285" stroke-width="1.5"/></marker></defs>
<g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1280" height="334" rx="22" fill="#102b25" stroke="none"/><text x="40" y="51" fill="#f4f2e9" font-size="27" font-weight="600" >Una prenotazione non è solo un pulsante «Salva».</text><rect x="40" y="86" width="270" height="163" rx="15" fill="#1b3d31" stroke="#3b5a47"/><text x="60" y="119" fill="#9fc5a8" font-size="13" font-weight="650" >01</text><text x="60" y="154" fill="#f4f2e9" font-size="24" font-weight="600" >Scegli</text><text x="60" y="190" fill="#bdd0bf" font-size="13" font-weight="400" >Cliente, operatrice, servizi.</text><text x="60" y="213" fill="#bdd0bf" font-size="13" font-weight="400" >Durate e buffer lato server.</text><path d="M318 166h21" stroke="#749285" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="86" width="270" height="163" rx="15" fill="#1b3d31" stroke="#3b5a47"/><text x="370" y="119" fill="#9fc5a8" font-size="13" font-weight="650" >02</text><text x="370" y="154" fill="#f4f2e9" font-size="24" font-weight="600" >Verifica</text><text x="370" y="190" fill="#bdd0bf" font-size="13" font-weight="400" >Orari, vincoli e Calendar.</text><text x="370" y="213" fill="#bdd0bf" font-size="13" font-weight="400" >Provider non disponibile? Stop.</text><path d="M628 166h21" stroke="#749285" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="86" width="270" height="163" rx="15" fill="#1b3d31" stroke="#3b5a47"/><text x="680" y="119" fill="#9fc5a8" font-size="13" font-weight="650" >03</text><text x="680" y="154" fill="#f4f2e9" font-size="24" font-weight="600" >Registra</text><text x="680" y="190" fill="#bdd0bf" font-size="13" font-weight="400" >Appuntamento + outbox</text><text x="680" y="213" fill="#bdd0bf" font-size="13" font-weight="400" >nella transazione PostgreSQL.</text><path d="M938 166h21" stroke="#749285" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="86" width="270" height="163" rx="15" fill="#1b3d31" stroke="#3b5a47"/><text x="990" y="119" fill="#9fc5a8" font-size="13" font-weight="650" >04</text><text x="990" y="154" fill="#f4f2e9" font-size="24" font-weight="600" >Sincronizza</text><text x="990" y="190" fill="#bdd0bf" font-size="13" font-weight="400" >Il worker aggiorna Google.</text><text x="990" y="213" fill="#bdd0bf" font-size="13" font-weight="400" >Gli esiti restano visibili.</text><text x="40" y="290" fill="#e8d2a1" font-size="12" font-weight="650" letter-spacing="1">IN CODA ≠ SINCRONIZZATO</text><text x="338" y="290" fill="#bdd0bf" font-size="14" font-weight="400" >La transazione locale non è una transazione ACID con Google: può servire riconciliazione.</text></g>
</svg>
