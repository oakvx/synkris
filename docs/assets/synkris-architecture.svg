<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
<title id="title">Architettura di synk e confine dei dati</title><desc id="desc">Sul PC del salone: browser, PHP, PostgreSQL, Node/whatsapp-web.js, file riservati e Ollama opzionale. PHP accede al database e al gate Node; il worker usa l’outbox. Google Calendar, WhatsApp e SMTP sono esterni. Il disegno è semplificato e non rappresenta una transazione distribuita.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#AF7CE6" stroke-width="1.5"/></marker></defs>
