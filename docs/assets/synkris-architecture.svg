m="translate(385 373) scale(1.1666666666666667)" fill="none" stroke="#7D38B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></g><text x="430" y="386" fill="#29194A" font-size="21" font-weight="650" >PostgreSQL 16</text><text x="430" y="415" fill="#78618F" font-size="13" font-weight="400" >Appuntamenti e catalogo</text><text x="430" y="436" fill="#78618F" font-size="13" font-weight="400" >Outbox nella stessa transazione</text><rect x="365" y="535" width="282" height="119" rx="15" fill="#ffffff" stroke="#E4D6F4"/><g transform="translate(385 557) scale(1.1666666666666667)" fill="none" stroke="#7D38B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></g><text x="430" y="570" fill="#29194A" font-size="20" font-weight="650" >Node.js + bot</text><text x="430" y="600" fill="#78618F" font-size="13" font-weight="400" >whatsapp-web.js · LocalAuth</text><text x="430" y="621" fill="#78618F" font-size="13" font-weight="400" >Calendar, worker e API interne</text><rect x="58" y="373" width="250" height="126" rx="15" fill="#ffffff" stroke="#E4D6F4"/><g transform="translate(78 395) scale(1.125)" fill="none" stroke="#7D38B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v3"/></g><text x="121" y="408" fill="#29194A" font-size="20" font-weight="650" >File riservati</text><text x="80" y="445" fill="#78618F" font-size="13" font-weight="400" >Config, sessioni e credenziali</text><text x="80" y="467" fill="#78618F" font-size="13" font-weight="400" >fuori da Git e dagli ZIP.</text><rect x="58" y="545" width="250" height="109" rx="15" fill="#ffffff" stroke="#E4D6F4"/><g transform="translate(78 565) scale(1.125)" fill="none" stroke="#7D38B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path 