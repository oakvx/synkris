und"><path d="M7 19a5 5 0 1 1-1-10 7 7 0 0 1 13-2 6 6 0 0 1-1 12H7Z"/></g><text x="1045" y="585" fill="#29194A" font-size="18" font-weight="650" >SMTP</text><text x="1009" y="616" fill="#78618F" font-size="12" font-weight="400" >Solo su opt-in</text><text x="1009" y="636" fill="#78618F" font-size="12" font-weight="400" >Avvisi tecnici configurati</text><path d="M308 233H358" fill="none" stroke="#AF7CE6" stroke-width="2" marker-end="url(#arrow)"/><path d="M506 289V345" fill="none" stroke="#AF7CE6" stroke-width="2" marker-end="url(#arrow)"/><path d="M506 471V528" fill="none" stroke="#AF7CE6" stroke-width="2" marker-end="url(#arrow)"/><path d="M647 582H723V270H982" fill="none" stroke="#AF7CE6" stroke-width="2" marker-end="url(#arrow)"/><path d="M723 446H982" fill="none" stroke="#AF7CE6" stroke-width="2" marker-end="url(#arrow)"/><path d="M647 620H982" fill="none" stroke="#AF7CE6" stroke-width="2" marker-end="url(#arrow)"/><path d="M308 591H358" fill="none" stroke="#AF7CE6" stroke-width="2" marker-end="url(#arrow)"/><path d="M647 235H851V554H654" fill="none" stroke="#AF7CE6" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="664" y="223" fill="#78618F" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="400" >proxy / gate Calendar</text><text x="756" y="691" fill="#78618F" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="400" >schema semplificato</text><text x="42" y="724" fill="#78618F" font-size="13" font-weight="400" >La collocazione locale del database non impedisce l’invio di dati necessario alle integrazioni esterne.</text></g>
