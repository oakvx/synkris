<title id="title">synk — Meno incastri. Più tempo per le persone.</title><desc id="desc">Gestione locale degli appuntamenti per saloni, con dashboard, team e integrazioni. RC6 solo collaudo, licenza proprietaria: uso privato non commerciale gratuito, altri usi su accordo commerciale. La parte destra è un’illustrazione.</desc>
