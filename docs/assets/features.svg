<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">Le capacità principali di synk</title><desc id="desc">Agenda normalizzata, stati Calendar espliciti, presa in carico delle chat e manutenzione con riconciliazione. Queste capacità non sostituiscono il collaudo dei provider reali.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#749285" stroke-width="1.5"/></marker></defs>
<g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1280" height="480" rx="22" fill="#f4f2e9" stroke="none"/><text x="44" y="55" fill="#203e33" font-size="29" font-weight="650" >Una console. Quattro punti fermi.</text><rect x="34" y="82" width="588" height="172" rx="16" fill="#ffffff" stroke="#dae3d8"/><rect x="54" y="104" width="43" height="43" rx="12" fill="#eaf2e6" stroke="none"/><g transform="translate(63 113) scale(1.0416666666666667)" fill="none" stroke="#216353" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5h3m3 0h2"/></g><text x="116" y="132" fill="#203e33" font-size="21" font-weight="650" >Agenda con contesto</text><text x="58" y="181" fill="#718277" font-size="15" font-weight="400" >Servizi ordinati, durate per operatrice,</text><text x="58" y="206" fill="#718277" font-size="15" font-weight="400" >buffer, orari, chiusure e assenze.</text><rect x="646" y="82" width="588" height="172" rx="16" fill="#ffffff" stroke="#dae3d8"/><rect x="666" y="104" width="43" height="43" rx="12" fill="#eaf2e6" stroke="none"/><g transform="translate(675 113) scale(1.0416666666666667)" fill="none" stroke="#216353" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 0 0-14-5L3 8m0-5v5h5M4 14a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/></g><text x="728" y="132" fill="#203e33" font-size="21" font-weight="650" >Stati che non ingannano</text><text x="670" y="181" fill="#718277" font-size="15" font-weight="400" >Database e Google non sono la stessa cosa.</text><text x="670" y="206" fill="#718277" font-size="15" font-weight="400" >In coda, sincronizzato e da verificare restano distinti.</text><rect x="34" y="272" width="588" height="172" rx="16" fill="#ffffff" stroke="#dae3d8"/><rect x="54" y="294" width="43" height="43" rx="12" fill="#eaf2e6" stroke="none"/><g transform="translate(63 303) scale(1.0416666666666667)" fill="none" stroke="#216353" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11a8 8 0 0 1-8 8H7l-4 3V11a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/><path d="M8 9h8m-8 5h5"/></g><text x="116" y="322" fill="#203e33" font-size="21" font-weight="650" >Il team resta al comando</text><text x="58" y="371" fill="#718277" font-size="15" font-weight="400" >Conversazioni e presa in carico manuale.</text><text x="58" y="396" fill="#718277" font-size="15" font-weight="400" >AI locale opzionale, disattivata per default.</text><rect x="646" y="272" width="588" height="172" rx="16" fill="#ffffff" stroke="#dae3d8"/><rect x="666" y="294" width="43" height="43" rx="12" fill="#eaf2e6" stroke="none"/><g transform="translate(675 303) scale(1.0416666666666667)" fill="none" stroke="#216353" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8 3v6c0 5-4 9-8 11-4-2-8-6-8-11V5l8-3Z"/><path d="m8 12 3 3 5-6"/></g><text x="728" y="322" fill="#203e33" font-size="21" font-weight="650" >Manutenzione esplicita</text><text x="670" y="371" fill="#718277" font-size="15" font-weight="400" >Aggiornamenti con checksum e manifest.</text><text x="670" y="396" fill="#718277" font-size="15" font-weight="400" >Dopo un restore, riconciliazione umana prima di ripartire.</text></g>
</svg>
