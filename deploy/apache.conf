<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    ServerSignature Off
    TraceEnable Off
    LimitRequestBody 65536
    <Directory /var/www/html>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex dashboard.php
        RewriteEngine On
        # Only the authenticated entry points and non-sensitive static assets are public.
        RewriteRule ^(?:deploy|dashboard/api|secrets|runtime|setup|src|scripts|tests|strumenti)(?:/|$) - [F,END]
        RewriteRule (^|/)\. - [F,END]
        RewriteRule ^dashboard/view\.html$ - [F,END]
        RewriteRule ^(?:dashboard\.php|bridge\.php)$ - [END]
        RewriteRule ^(?:dashboard/assets/[A-Za-z0-9_.-]+\.(?:js|css)|assets/[A-Za-z0-9_.-]+\.svg)$ - [END]
        RewriteRule ^$ dashboard.php [END,QSA]
        RewriteRule ^ - [R=404,END]
    </Directory>
    <FilesMatch "\.(?:env|json|ya?ml|md|txt|sql|bat|ps1|dump|pem|key|zip)$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    # Query strings and bodies can contain private data; do not log them.
    CustomLog /proc/self/fd/1 "%h %t %m %>s"
</VirtualHost>
